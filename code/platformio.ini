; PlatformIO project — PNP board, ESP32-S3-DevKitC
; Firmware: six-axis WiFi tuning panel; drivers OFF on power-up.
;
; Board is connected via the native USB port (/dev/cu.usbmodem*), which on the
; ESP32-S3 is the built-in USB-Serial/JTAG controller. esptool uploads over it
; directly — no external UART adapter needed.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; TMC2209 UART control + accelerated step generation
lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    links2004/WebSockets@2.7.3
    ; 0.31.8 reproduces non-terminating RMT moves on Y1/C0 on this ESP32-S3.
    ; Pin the tested 0.31.7 source for both USB and OTA builds.
    https://github.com/gin66/FastAccelStepper.git#33b1f96e506ec48777d526c7bd22ed3e1a8bc053

; Actual module is an N16R8: 16 MB flash + 8 MB PSRAM (GD25Q128, MAC d4:05:92:7a:f6:24).
; Match the flash size so writes verify correctly. PSRAM stays unused by this firmware.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; Let PlatformIO auto-detect the port, or pin it explicitly if detection is
; ambiguous (uncomment the lines below):
; upload_port = /dev/cu.usbmodem1234561
; monitor_port = /dev/cu.usbmodem1234561

; USB CDC on boot so Serial prints show up over the native USB port.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
